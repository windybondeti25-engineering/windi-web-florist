<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style>
    .bg { fill: #fff5f7; }
    .box { fill: #ffffff; stroke: #ffccd5; stroke-width: 2; rx: 10; ry: 10; }
    .box-header { fill: #ffccd5; stroke: #d63384; stroke-width: 2; rx: 10; ry: 10; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 16px; fill: #800f2f; text-anchor: middle; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #590d22; text-anchor: middle; }
    .item-box { fill: #fff0f3; stroke: #ff4d6d; stroke-width: 1; rx: 6; ry: 6; }
    .item-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #a4133c; text-anchor: middle; font-weight: 600; }
    .arrow { stroke: #d63384; stroke-width: 2.5; marker-end: url(#arrowhead); }
    .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #d63384; font-weight: bold; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d63384" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Layer 1: Client -->
  <rect x="200" y="30" width="400" height="70" class="box-header" />
  <text x="400" y="58" class="title">PENGGUNA / CLIENT</text>
  <text x="400" y="80" class="subtitle">(Web Browser: Chrome, Edge, Mobile Phone)</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="100" x2="400" y2="140" class="arrow" />
  <text x="480" y="125" class="label">Akses HTTP / HTTPS</text>

  <!-- Layer 2: Frontend Landing Page -->
  <rect x="80" y="145" width="640" height="210" class="box" />
  <text x="400" y="175" class="title">FRONTEND LANDING PAGE (WINDI FLORIST)</text>
  
  <!-- Sub Components -->
  <rect x="110" y="195" width="160" height="45" class="item-box" />
  <text x="190" y="222" class="item-text">Header &amp; Navigasi</text>

  <rect x="320" y="195" width="160" height="45" class="item-box" />
  <text x="400" y="222" class="item-text">Hero Section</text>

  <rect x="530" y="195" width="160" height="45" class="item-box" />
  <text x="610" y="222" class="item-text">Katalog Bunga</text>

  <rect x="215" y="260" width="160" height="45" class="item-box" />
  <text x="295" y="287" class="item-text">Tentang Kami</text>

  <rect x="425" y="260" width="160" height="45" class="item-box" />
  <text x="505" y="287" class="item-text">Kontak &amp; Footer</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="355" x2="400" y2="395" class="arrow" />
  <text x="485" y="380" class="label">Klik Tombol Pemesanan</text>

  <!-- Layer 3: External WhatsApp -->
  <rect x="200" y="400" width="400" height="65" class="box-header" />
  <text x="400" y="428" class="title">LAYANAN EKSTERNAL (WHATSAPP API)</text>
  <text x="400" y="448" class="subtitle">Mengarahkan Pesanan Langsung ke WhatsApp Admin</text>
</svg>
